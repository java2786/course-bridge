spring:
  application:
    name: course-bridge-gateway

  cloud:
    config:
      enabled: false
    gateway:
      routes:
        - id: student-service
          uri: lb://course-bridge-student-service
          predicates:
            - Path=/students/**
        - id: course-service
          uri: lb://course-bridge-course-service
          predicates:
            - Path=/courses/**
        - id: enrollment-service
          uri: lb://course-bridge-enrollment-service
          predicates:
            - Path=/enrollments/**

      discovery:
        locator:
          enabled: true
      httpclient:
        response-timeout: 5s

server:
  port: 5555

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8762/eureka/