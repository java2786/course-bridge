server:
  port: 9093


spring:
  application:
    name: course-bridge-enrollment-service

  datasource:
    url: jdbc:h2:mem:enrollmentdb
    # url: jdbc:h2:file:/data/demo
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8762/eureka/