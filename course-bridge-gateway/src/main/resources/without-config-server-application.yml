server:
  port: 5555

spring:
  application:
    name: course-bridge-gateway

  cloud:
    gateway:
      routes:
        - id: student-service
          uri: lb://course-bridge-student-service/
          predicates: 
            - Path= /students/**
          filters:
            - name: CustomErrorFilter
        - id: course-service
          uri: lb://course-bridge-course-service/
          predicates: 
            - Path= /courses/**
          filters:
            - name: CustomErrorFilter
        - id: enrollment-service
          uri: lb://course-bridge-enrollment-service/
          predicates: 
            - Path= /enrollments/**
          filters:
            - name: CustomErrorFilter

      default-filters:
        - name: CustomErrorFilter

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8762/eureka/